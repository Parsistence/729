name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk 729.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: 729-apk
          path: 729.apk

      # Keeps one "latest" release with a direct APK download link you can open on your phone
      - name: Publish latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest 729.apk \
            --title "729 (latest build #${{ github.run_number }})" \
            --notes "Built from ${{ github.sha }}. Download 729.apk on your Android phone to install or update." \
            --target ${{ github.sha }} \
            --prerelease
